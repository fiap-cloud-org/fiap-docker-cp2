# Sobe o MySQL com o volume dados_mysql e o microserviço na mesma rede.
# Uso: cp .env.example .env && docker compose up -d --build --wait

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mysql_db}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
    ports:
      # Só no localhost, para inspecionar o banco com um cliente MySQL
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # TCP em 127.0.0.1: só responde quando o servidor definitivo sobe, depois do init.sql
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend]

  microservico:
    build: ./meu-microservico
    image: ${IMAGE_NAME:-local/meu-microservico}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mysql_db}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks: [backend]

volumes:
  dados_mysql:
    name: dados_mysql

networks:
  backend:
    name: meu-microservico-rede
